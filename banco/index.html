<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9Pilla</title>
<meta name="description" content="9Pilla APP: app educativo de investimentos. Entenda o mercado e veja como o dinheiro pode render.">
<meta name="theme-color" content="#09C797">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --menta:#09C797; --marinho:#122B4A; --logo:#2FCD7F; --creme:#EFEFE4; --branco:#FFFFFF;
  --floresta:#0B2A1B; --lima:#7DF14E; --mentaClaro:#CEFBDA; --royal:#053E75;
  --texto:#122B4A; --suave:#3D5470; --nota:#4A5A6E; --verdeTexto:#077A5D; --vermelho:#B3261E;
  --linha:rgba(18,43,74,.1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--creme);color:var(--texto);font-family:'Manrope',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button,input,select{font-family:inherit;color:inherit}
a{color:var(--verdeTexto)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--creme);position:relative}
main{flex:1 1 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hdr{background:var(--floresta);color:var(--creme);padding:calc(16px + env(safe-area-inset-top)) 20px 22px;display:flex;flex-direction:column;gap:14px}
.hdr.navy{background:var(--marinho)}
.hdr.menta{background:var(--menta);color:var(--floresta)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{display:flex;align-items:baseline;gap:1px;text-decoration:none}
.logo .n{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:28px;color:var(--logo);line-height:1}
.logo .p{font-weight:800;font-size:21px;color:var(--creme);letter-spacing:-.5px;line-height:1}
.hdr.menta .logo .n{color:var(--marinho)} .hdr.menta .logo .p{color:#fff}
.iconbtn{width:44px;height:44px;border-radius:22px;border:1px solid rgba(239,239,228,.3);background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.hdr.menta .iconbtn{border-color:rgba(11,42,27,.3)}
h1.big{margin:0;font-family:'Anton',sans-serif;font-weight:400;font-size:34px;text-transform:uppercase;line-height:1.05;letter-spacing:.3px}
.hl{color:var(--lima)} .hdr.menta .hl{color:var(--marinho)}
.sub{font-size:14px;line-height:1.5;color:var(--mentaClaro)}
.hdr.menta .sub{color:var(--floresta)}
.wrap{padding:0 16px;display:flex;flex-direction:column;gap:12px;margin-top:14px}
.card{background:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card.dark{background:var(--floresta);color:var(--creme)}
.card.navy{background:var(--marinho);color:var(--creme)}
.card.mint{background:var(--mentaClaro);color:var(--floresta)}
.card.warn{background:#FFE9B8;color:#5A3D00}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase}
.card.dark .eyebrow,.card.navy .eyebrow{color:var(--lima)}
.card.mint .eyebrow{color:var(--verdeTexto)}
h2{margin:0;font-size:17px;font-weight:800}
p{margin:0}
.muted{color:var(--suave);font-size:13px;line-height:1.5}
.small{font-size:12px;line-height:1.5}
.legal{font-size:11px;line-height:1.5;color:var(--nota);margin:16px 16px 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.btn{min-height:52px;border-radius:16px;border:none;background:var(--marinho);color:#fff;font-size:16px;font-weight:800;cursor:pointer;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.menta{background:var(--menta);color:var(--floresta)}
.btn.lima{background:var(--lima);color:var(--floresta)}
.btn.ghost{background:transparent;border:2px solid var(--marinho);color:var(--marinho)}
.btn.small{min-height:44px;font-size:14px;border-radius:22px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{min-height:44px;padding:0 14px;border-radius:22px;border:2px solid rgba(18,43,74,.2);background:#fff;color:var(--marinho);font-size:13px;font-weight:800;cursor:pointer;white-space:nowrap}
.pill[aria-pressed=true],.pill[aria-selected=true]{background:var(--marinho);color:#fff;border-color:var(--marinho)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.hdr .pill{background:transparent;color:var(--creme);border-color:rgba(239,239,228,.35)}
.hdr .pill[aria-selected=true]{background:var(--lima);color:var(--floresta);border-color:var(--lima)}
.card.navy .pill,.card.dark .pill{background:transparent;color:var(--creme);border-color:rgba(239,239,228,.35)}
.card.navy .pill[aria-pressed=true],.card.dark .pill[aria-pressed=true]{background:var(--lima);color:var(--floresta);border-color:var(--lima)}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--marinho);font-size:13px;font-weight:700;background:none;border:none;cursor:pointer;padding:0}
.qa .ic{width:60px;height:60px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center}
.qa.on .ic{background:var(--menta);color:var(--floresta)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--suave)}
.input{min-height:50px;border-radius:12px;border:2px solid rgba(18,43,74,.2);padding:0 14px;font-size:16px;background:#fff;width:100%}
.input:focus,.pill:focus-visible,.btn:focus-visible,.iconbtn:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--menta);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--menta);min-height:32px}
.money{font-size:34px;font-weight:800;letter-spacing:-1px}
.mov{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--linha);gap:10px}
.mov:last-child{border-bottom:none}
.mov .t{font-weight:700;font-size:15px}
.pos{color:var(--verdeTexto);font-weight:800}
.neg{color:var(--vermelho);font-weight:800}
.badge{font-size:12px;font-weight:800;letter-spacing:1px;padding:6px 10px;border-radius:10px;white-space:nowrap}
.b-alta{background:#CEFBDA;color:#0B2A1B}.b-lateral{background:#DCE6F2;color:#122B4A}.b-queda{background:#FFE0DA;color:#7A1F12}.b-observar{background:#FFE9B8;color:#5A3D00}
.ind{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:var(--creme);border-radius:12px;padding:10px;font-size:11px;color:var(--suave)}
.ind strong{display:block;font-size:12px;color:var(--marinho)}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
.strip span{height:10px;border-radius:3px}
.s-alta{background:#2FCD7F}.s-lateral{background:#8FA8C8}.s-queda{background:#E8806E}.s-observar{background:#F2C14E}
.demo{background:#FFE9B8;color:#5A3D00;font-size:12px;font-weight:700;text-align:center;padding:8px 12px;line-height:1.4}
nav.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#fff;border-top:1px solid var(--linha);padding:6px 6px calc(10px + env(safe-area-inset-bottom));z-index:10}
nav.bottom a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--suave);font-size:11px;font-weight:600}
nav.bottom a[aria-current=page]{color:var(--verdeTexto);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--floresta);color:var(--creme);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:700;z-index:20;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.chart{width:100%;height:auto;display:block;background:var(--creme);border-radius:10px}
.bar{height:10px;background:var(--creme);border-radius:5px;overflow:hidden}
.bar>div{height:10px;border-radius:5px}
.opt{min-height:44px;padding:8px 12px;border-radius:12px;text-align:left;font-size:13px;font-weight:700;cursor:pointer;background:var(--creme);border:2px solid var(--creme);width:100%}
.opt[aria-pressed=true]{background:var(--marinho);color:#fff;border-color:var(--marinho)}
.skeleton{background:linear-gradient(90deg,#fff 0,#f4f4ec 50%,#fff 100%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:18px;height:180px}
@keyframes sk{to{background-position:-200% 0}}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Identidade 9Pilla APP: menta do logo (#09C797, PANTONE 3395 C) como cor principal */
.hdr,.hdr.navy,.hdr.menta{background:var(--menta);color:var(--floresta)}
.hdr .logo .n,.hdr .logo .p{color:#fff}
.hdr .logo .p{font-weight:800;letter-spacing:-.8px}
.hdr .iconbtn{border-color:rgba(11,42,27,.28);color:var(--floresta)}
.hdr a.iconbtn[href="#/perfil"]{background:var(--floresta)!important;color:var(--menta)!important}
.hdr h1.big{color:var(--floresta)}
.hdr .hl{background:var(--floresta);color:var(--lima);padding:0 8px;border-radius:8px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hdr .sub,.hdr .muted{color:var(--floresta)}
.hdr .pill{background:rgba(255,255,255,.35);border-color:transparent;color:var(--floresta)}
.hdr .pill[aria-selected=true],.hdr .pill[aria-pressed=true]{background:var(--floresta);color:#fff;border-color:var(--floresta)}
.card.navy{background:var(--floresta)}
.btn{background:var(--menta);color:var(--floresta)}
.btn.ghost{background:transparent;border-color:var(--floresta);color:var(--floresta)}
.card.navy .btn,.card.dark .btn{background:var(--menta);color:var(--floresta)}
.pill[aria-pressed=true],.pill[aria-selected=true],.opt[aria-pressed=true]{background:var(--floresta);border-color:var(--floresta);color:#fff}
.qa{color:var(--floresta)}
.qa .ic{box-shadow:0 1px 0 rgba(11,42,27,.06)}
nav.bottom a[aria-current=page]{color:var(--floresta)}
nav.bottom a[aria-current=page] svg{background:var(--mentaClaro);border-radius:12px;padding:3px 14px;box-sizing:content-box;color:var(--verdeTexto)}
.card{box-shadow:0 1px 2px rgba(11,42,27,.05)}
.hdr h1.big{line-height:1.18}
.badge{white-space:normal}

/* A Bolsa é Delas: nude claro */
.delas{background:#F3E5DB;min-height:100vh;padding-bottom:90px;--nude:#F3E5DB;--nude2:#E9D0C1;--cacau:#4E3128;--terracota:#B5705C;--rosado:#F8EEE8}
.delas .hdr{background:var(--nude2);color:var(--cacau)}
.delas .hdr h1.big{color:var(--cacau)}
.delas .hdr .hl{background:var(--cacau);color:var(--nude)}
.delas .hdr .sub{color:var(--cacau)}
.delas .hdr .iconbtn{color:var(--cacau);border-color:rgba(78,49,40,.3)}
.delas .hdr .logo .n,.delas .hdr .logo .p{color:var(--cacau)}
.delas .wrap{background:transparent}
.delas .card{background:var(--rosado);border:1px solid var(--nude2);color:var(--cacau)}
.delas .card .muted,.delas .card .small{color:#6E4D41}
.delas .eyebrow{color:var(--terracota)}
.delas .btn{background:var(--cacau);color:var(--nude)}
.delas .btn.ghost{background:transparent;color:var(--cacau);border-color:var(--cacau)}
.delas-tag{display:inline-block;background:var(--cacau);color:var(--nude);font-weight:800;font-size:12px;letter-spacing:1.5px;padding:6px 12px;border-radius:999px;text-transform:uppercase}
.delas-num{font-family:'Anton',sans-serif;font-size:28px;color:var(--terracota);line-height:1}
.delas-passo{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start}
.card-delas{background:#F3E5DB;color:#4E3128;border:1px solid #E9D0C1;text-decoration:none}
.card-delas .eyebrow{color:#B5705C}
.wa{display:flex;align-items:center;justify-content:center;gap:10px;min-height:56px;border-radius:999px;background:#1F8A55;color:#fff;font-weight:800;font-size:16px;text-decoration:none}
</style>

function renderCaixinha() {
  if (!conta || conta.caixinha <= 0) { if (conta) conta.caixinhaTs = Date.now(); return; }
  const dias = Math.floor((Date.now() - conta.caixinhaTs) / 86400000);
  if (dias < 1) return;

  if (uteis < 1) return;

  const ganho = +(conta.caixinha * (fator - 1)).toFixed(2);
  conta.caixinha = +(conta.caixinha + ganho).toFixed(2);
  conta.caixinhaTs += dias * 86400000;
  if (ganho > 0) lancar('Rendimento da caixinha (' + uteis + (uteis === 1 ? ' dia útil' : ' dias úteis') + ')', 0, ganho);

      <span class="card" style="background:rgba(239,239,228,.08);padding:8px;gap:2px">Inflação 12m<strong style="color:#fff;font-size:15px">${pct(tx.ipca12)}</strong></span></div>

    </section>

      <p style="font-size:15px;line-height:1.5">Com ${brl(v, 0)} por ${rot}, ${lista[0].nome} deixaria ${brl(lista[0].l - poup.l, 0)} a mais que a poupança, já descontado o imposto. Acima da inflação, a renda fixa pós-fixada rende hoje cerca de ${pct(realAa, 1)} ao ano de ganho real.</p></section>

/* ============ Metas ============ */
function telaMetas() {
  const tx = T(); const { meta, aporte } = UI.meta;
  const realAa = (1 + (tx.cdi / 100) * 0.85) / (1 + tx.ipca12 / 100) - 1;
  const poupReal = Math.pow(1 + tx.poupMes / 100, 12) / (1 + tx.ipca12 / 100) - 1;
  const mensal = (aa) => Math.pow(1 + aa, 1 / 12) - 1;
  const meses = (M, ap, r) => r <= 0 ? Math.ceil(M / ap) : Math.ceil(Math.log(M * r / ap + 1) / Math.log(1 + r));
  const fp = (n) => { const a = Math.floor(n / 12), m = n % 12; const pa = a ? a + (a === 1 ? ' ano' : ' anos') : ''; const pm = m ? m + (m === 1 ? ' mês' : ' meses') : ''; return pa && pm ? pa + ' e ' + pm : (pa || pm || 'já chegou'); };
  const n = meses(meta, aporte, mensal(realAa)), nP = meses(meta, aporte, mensal(poupReal)), nC = Math.ceil(meta / aporte), n2 = meses(meta, aporte + 100, mensal(realAa));
  const ap = Math.min(meta, aporte * n), pa = ap / meta * 100;
  const OBJ = [['reserva', 'Reserva de emergência', '6 meses de gastos', 15000, 500], ['casa', 'Entrada da casa', '20% de um imóvel', 80000, 1000], ['sonho', 'Um sonho', 'viagem, carro, estudo', 20000, 600], ['liberdade', 'Renda para a vida', 'viver de renda', 1000000, 2000]];
  return `<header class="hdr"><div class="toprow"><a class="iconbtn" href="#/investir" aria-label="Voltar">${ic('back', 20)}</a>${logo()}</div>
    <h1 class="big">Quando você chega <span class="hl">lá</span>?</h1>
    <p class="sub">Escolha uma meta, diga quanto guarda por mês e veja os juros compostos trabalhando.</p></header>
  <div class="wrap">
    <div class="grid2">${OBJ.map(([id, l, d, mt, a]) => `<button class="opt" style="background:${UI.meta.obj === id ? 'var(--marinho)' : '#fff'};border-color:${UI.meta.obj === id ? 'var(--marinho)' : '#fff'};color:${UI.meta.obj === id ? '#fff' : 'var(--marinho)'};min-height:64px" aria-pressed="${UI.meta.obj === id}" data-act="metaobj" data-id="${id}" data-m="${mt}" data-a="${a}"><strong style="display:block">${l}</strong><span style="font-size:11px;font-weight:600">${d}</span></button>`).join('')}</div>
    <section class="card">
      <label for="mt-m" class="row" style="font-weight:700;font-size:13px">Valor da meta<strong style="font-size:20px">${brl(meta, 0)}</strong></label>
      <input id="mt-m" type="range" min="1000" max="1000000" step="1000" value="${meta}" data-range="meta.meta">
      <label for="mt-a" class="row" style="font-weight:700;font-size:13px">Quanto guardo por mês<strong style="font-size:20px">${brl(aporte, 0)}</strong></label>
      <input id="mt-a" type="range" min="50" max="10000" step="50" value="${aporte}" data-range="meta.aporte">
    </section>
    <section class="card dark"><span class="eyebrow">Investindo na renda fixa</span>
      <span style="font-family:'Anton',sans-serif;font-size:40px;line-height:1;color:#fff">${fp(n)}</span>
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(239,239,228,.15)" role="img" aria-label="${Math.round(pa)}% vem do que você guardou e ${Math.round(100 - pa)}% dos juros"><div style="width:${pa.toFixed(1)}%;background:var(--logo)"></div><div style="width:${(100 - pa).toFixed(1)}%;background:var(--lima)"></div></div>
      <span class="small" style="color:var(--mentaClaro)">Você guardou ${brl(ap, 0)} · juros fizeram ${brl(Math.max(0, meta - ap), 0)}</span>
      <p style="font-size:14px;line-height:1.5">Guardando sem investir, levaria ${fp(nC)}. Na poupança, ${fp(nP)}.</p></section>
    <section class="card mint"><span class="eyebrow">E se guardar um pouco mais?</span>
      <p class="small">Com ${brl(aporte + 100, 0)} por mês, você chega em ${fp(n2)}${n - n2 > 0 ? ' (' + fp(n - n2) + ' antes)' : ''}. O que mais acelera uma meta é a constância do aporte.</p></section>
  </div>
  <p class="legal">Simulação em dinheiro de hoje: usa o CDI atual (${pct(tx.cdi)}), desconta 15% de IR e a inflação de 12 meses (${pct(tx.ipca12)}), e supõe taxas constantes. Conteúdo educacional, não é recomendação (Resolução CVM 20).</p>`;
}

function cardComparativo() {

  const p = c.pts, ult = p[p.length - 1], W = 320, H = 150, pad = 6;
  const max = Math.max(...p.map((x) => Math.max(x.ivvb, x.bova, x.cdi)));
  const X = (i) => (pad + i * (W - 2 * pad) / (p.length - 1)).toFixed(1), Y = (v) => (H - pad - v / max * (H - 2 * pad)).toFixed(1);
  const linha = (k) => p.map((x, i) => X(i) + ',' + Y(x[k])).join(' ');
  const mes = (m) => { const [a, mm] = m.split('-'); return ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+mm - 1] + '/' + a.slice(2); };
  const itens = [['ivvb', 'S&P 500 em reais (IVVB11)', '#09C797', ''], ['cdi', 'CDI (renda fixa)', '#EFEFE4', ''], ['bova', 'Ibovespa (BOVA11)', '#7DF14E', '4 3']].sort((a, b) => ult[b[0]] - ult[a[0]]);
  return `<section class="card dark"><span class="eyebrow">R$ 1.000 por mês nos últimos 5 anos</span>
    <p style="font-size:14px;line-height:1.5">Quem investiu R$ 1.000 todo mês de ${mes(c.de)} a ${mes(c.ate)} colocou ${brl(ult.ap, 0)} do bolso. Hoje teria, antes do imposto:</p>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${itens.map((x) => x[1] + ' ' + brl(ult[x[0]], 0)).join(', ')}; total aportado ${brl(ult.ap, 0)}" style="background:rgba(239,239,228,.06)">
      <polyline points="${linha('ap')}" fill="none" stroke="#8A97A8" stroke-width="1.5" stroke-dasharray="2 3"/>
      ${itens.map(([k, , cor, dash]) => `<polyline points="${linha(k)}" fill="none" stroke="${cor}" stroke-width="2.5" ${dash ? `stroke-dasharray="${dash}"` : ''} stroke-linejoin="round"/>`).join('')}</svg>

    <div class="row small"><span style="display:flex;align-items:center;gap:8px;color:var(--mentaClaro)"><span style="width:18px;border-top:2px dotted #8A97A8"></span>Só o que saiu do bolso</span><strong style="color:#fff">${brl(ult.ap, 0)}</strong></div>
    <p class="small" style="color:var(--mentaClaro)">Na bolsa o caminho oscila bastante; o CDI sobe quase em linha reta. Em outros 5 anos a ordem pode ser outra. Valores brutos, sem imposto, taxas e dividendos, com compras no fechamento de cada mês.</p></section>`;
}

  // vencimentos de opções: terceira sexta-feira, antecipada se feriado
  for (let k = 0; k < 4; k++) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() + k, 1); let s = 0;
    while (true) { if (d.getDay() === 5 && ++s === 3) break; d.setDate(d.getDate() + 1); }
    while (!util(d)) d.setDate(d.getDate() - 1);

  ['poup', 'Poupança', 'Sem risco de preço, rende pouco'],

];
const OBJ_JOGO = [['aluguel', 'Aluguel', 'Maria', 600], ['reserva', 'Reserva de emergência', 'João', 500], ['faculdade', 'Faculdade', 'José', 900], ['viagem', 'Viagem', 'Jesus', 800]];
const EVENTOS = [['Mês tranquilo, sem surpresas.', 0], ['Bico no fim de semana rendeu um extra.', 100], ['A conta de luz veio alta.', -60], ['Décimo terceiro adiantado ajudou.', 150], ['O carro precisou de conserto.', -80], ['Venda de roupas usadas na internet.', 50]];
let J = null;
try { J = JSON.parse(localStorage.getItem(JKEY) || 'null'); } catch (e) { J = null; }
function jSalvar() { try { localStorage.setItem(JKEY, JSON.stringify(J)); } catch (e) {} }
function jNovo() {
  const meses = []; const d = new Date();
  for (let i = 1; i <= 6; i++) { const x = new Date(d.getFullYear(), d.getMonth() + i, 1); meses.push(x.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')); }
  J = { familia: 'Família ' + conta.nome, mes: 0, meses, potes: [], hist: [], escolha: { p: 'cdb', o: 'reserva' }, evento: null, entrada: 1000, fim: false, ret: {} };
  jSalvar();
}
function jRetornos() {
  const t = T(), g = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  return { poup: t.poupMes / 100, cdb: Math.pow(1 + t.cdi / 100, 1 / 12) - 1, ipca: Math.pow(1 + (t.ipca12 + 6.5) / 100, 1 / 12) - 1 + g() * 0.012,
    acoes: 0.01 + g() * 0.06, cripto: 0.015 + g() * 0.18 };
}
function jTotais() {
  const total = J.potes.reduce((a, p) => a + p.valor, 0), guardado = J.potes.reduce((a, p) => a + p.aportado, 0);
  const porObj = OBJ_JOGO.map(([id, n, quem, meta]) => { const v = J.potes.filter((p) => p.o === id).reduce((a, p) => a + p.valor, 0); return { id, n, quem, meta, v }; });
  return { total, guardado, rendeu: total - guardado, meta: OBJ_JOGO.reduce((a, o) => a + o[3], 0), porObj };
}
function jInvestir() {
  const { p, o } = J.escolha;
  const pote = J.potes.find((x) => x.p === p && x.o === o);
  if (pote) { pote.valor += J.entrada; pote.aportado += J.entrada; } else J.potes.push({ p, o, valor: J.entrada, aportado: J.entrada });
  // passa o mês: todos os potes rendem
  const r = jRetornos();
  J.potes.forEach((x) => { x.valor = Math.max(0, x.valor * (1 + r[x.p])); });
  PRODUTOS.forEach(([id]) => { J.ret[id] = (J.ret[id] || []).concat(r[id]); });
  J.hist.push({ mes: J.meses[J.mes], total: jTotais().total, guardado: jTotais().guardado });
  J.mes++;
  if (J.mes >= 6) { J.fim = true; jRanking(); }
  else { const ev = EVENTOS[Math.floor(Math.random() * EVENTOS.length)]; J.evento = ev[0]; J.entrada = 260 + ev[1]; }
  jSalvar();
}
function jRanking() {
  let rk = []; try { rk = JSON.parse(localStorage.getItem('9pilla.ranking') || '[]'); } catch (e) {}

  rk.sort((a, b) => b.total - a.total); rk = rk.slice(0, 5);

}

function opVenc() {

  while (lista.length < 6) {

    apagartudo: () => { if (!UI.apagarOk) { UI.apagarOk = true; setTimeout(() => { UI.apagarOk = false; }, 5000); return; } UI.apagarOk = false; try { ['9pilla.conta.v1', '9pilla.jogo.v1', '9pilla.ranking', '9pilla.cache'].forEach((k) => localStorage.removeItem(k)); } catch (x) {} J = null; conta = novaConta(NOME_PADRAO); salvar(); toast('Dados apagados deste aparelho'); location.hash = '#/inicio'; },
    jprod: () => { J.escolha.p = v; jSalvar(); },
    jobj: () => { J.escolha.o = v; jSalvar(); },
    jinvestir: () => { jInvestir(); window.scrollTo(0, 0); if (J.fim) toast('Fim dos 6 meses! Veja o resultado.'); },
    jnovo: () => { if (!UI.jConfirma) { UI.jConfirma = true; setTimeout(() => { UI.jConfirma = false; }, 5000); return; } UI.jConfirma = false; jNovo(); window.scrollTo(0, 0); },
    vertick: () => { UI.opTab = 'radar'; }
  };
  if (acts[a]) { acts[a](); render(); }
});
// campos de texto: atualiza só os botões, sem redesenhar a tela enquanto a pessoa digita
function atualizaBotoes() {
  const pv = num(UI.pix.valor), b = $('#pix-btn');
  if (b) { b.disabled = !(pv > 0 && pv <= conta.saldo && UI.pix.chave.trim()); b.textContent = 'Enviar Pix de ' + brl(pv); $('#pix-aviso').classList.toggle('hide', !(pv > conta.saldo)); }
  const gv = num(UI.guardar.valor), g1 = $('#g-guardar'), g2 = $('#g-resgatar');
  if (g1) { g1.disabled = !(gv > 0 && gv <= conta.saldo); g2.disabled = !(gv > 0 && gv <= conta.caixinha); }
}
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.bind) { const [g, k] = el.dataset.bind.split('.'); UI[g][k] = el.value; atualizaBotoes(); }
  // controles deslizantes: durante o arraste atualiza só o número; ao soltar, redesenha
  if (el.dataset.range) {
    const [g, k] = el.dataset.range.split('.'); UI[g][k] = +el.value;
    const lab = document.querySelector('label[for="' + el.id + '"] strong');
    if (lab) lab.textContent = (g === 'mundo' && k === 'spread') ? pct(+el.value, 1) : brl(+el.value, /meta|rf|div|renda|mundo/.test(g) ? 0 : 2);
  }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.range) { const id = el.id; render(); const n = document.getElementById(id); if (n) n.focus({ preventScroll: true }); }
  if (el.dataset.sel) { const [g, k] = el.dataset.sel.split('.'); UI[g][k] = el.value; UI.sim.k = null; render(); }
});

/* ============ Início do app ============ */
render();
carregar(false);
setInterval(() => { if (document.visibilityState === 'visible') carregar(false); }, 15 * 60 * 1000);
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
</script>
